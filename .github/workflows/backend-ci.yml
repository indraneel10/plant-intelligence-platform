name: Backend CI

on:
  pull_request:
    paths:
      - "app/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - main
      - plant-agent-v1
    paths:
      - "app/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: pytest -q
